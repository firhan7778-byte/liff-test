<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMOMOM MASSAGER</title>
    <link rel="stylesheet" href="liffuser.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<div class="app">
<!-- PROFILE -->
<header class="header">
    <div class="profile">
        <img id="avatar"
        src=""
        class="avatar">
        <div>
            <h3 id="name">
            กำลังโหลด...
            </h3>
            <p id="massager-id">
            MCA-00000
            </p>
        </div>
    </div>
    <div class="status">
        <i class="fa-solid fa-circle"></i>
        พร้อมรับงาน
    </div>
</header>
<!-- INCOME -->
<section class="income-card">
    <div>
    <p>
    รายได้เดือนนี้
    </p>
    <h1 id="income">
    ฿0
    </h1>
    <span id="job-count">
    0 งาน
    </span>
    </div>
    <i class="fa-solid fa-wallet"></i>
</section>
<!-- TODAY -->
<section>
<h3 class="title">
<i class="fa-solid fa-calendar-day"></i>
งานวันนี้
</h3>
<div id="today-job">
<div class="empty">
ยังไม่มีงานวันนี้
</div>
</div>
</section>

<!-- TOMORROW -->

<section>

<h3 class="title">

<i class="fa-solid fa-clock"></i>

งานพรุ่งนี้

</h3>



<div id="tomorrow-job">


<div class="empty">

ไม่มีงาน

</div>


</div>



</section>








<!-- ALL -->


<section>


<h3 class="title">

<i class="fa-solid fa-list"></i>

ตารางงานทั้งหมด

</h3>



<div id="all-job">

</div>



</section>



</div>






<!-- MENU -->

<nav class="bottom">

<button class="active">

<i class="fa-solid fa-house"></i>

หน้าแรก

</button>



<button>

<i class="fa-solid fa-briefcase"></i>

งาน

</button>




<button>

<i class="fa-solid fa-money-bill"></i>

รายได้

</button>



<button>

<i class="fa-solid fa-user"></i>

โปรไฟล์

</button>



</nav>





<script src="liffuser.js"></script>


</body>

</html>
