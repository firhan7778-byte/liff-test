<body>
<div class="app">
    <!-- PROFILE -->
    <header class="header">
        <div class="profile">
             <img width="100px" id="profileImage" src="" />
            <div>
                <b><span id="profileName"></span></b>
                <p id="massager-id">
                <span id="profileUID">UID : </span>
                </p>
            </div>
        </div>
        <div class="status">
            <i class="fa-solid fa-circle"></i>
            พร้อมรับงาน
        </div>
    </header>
    <!-- INCOME -->
    <section class="income-card">
        <div>
        <p>
        รายได้เดือนนี้
        </p>
        <h1 id="income">
        ฿0
        </h1>
        <span id="job-count">
        0 งาน
        </span>
        </div>
        <i class="fa-solid fa-wallet"></i>
    </section>
    <!-- TODAY -->
    <section>
        <h3 class="title">
        <i class="fa-solid fa-calendar-day"></i>
        งานวันนี้
        </h3>
        <div id="today-job">
        <div class="empty">
        ยังไม่มีงานวันนี้
        </div>
        </div>
    </section>

    <!-- TOMORROW -->

    <section>

    <h3 class="title">

    <i class="fa-solid fa-clock"></i>

    งานพรุ่งนี้

    </h3>



    <div id="tomorrow-job">


    <div class="empty">

    ไม่มีงาน

    </div>


    </div>



    </section>
    <!-- ALL -->
    <section>
        <h3 class="title">
        <i class="fa-solid fa-list"></i>
        ตารางงานทั้งหมด
        </h3>
        <div id="all-job">
        </div>
    </section>
</div>

<script src="liffuser.js"></script>
<script>
    let userId = "";

      const logOut = () => {
        liff.logout();
        window.location.reload();
      };
      const main = async () => {
        await liff.init({ liffId: "2010610671-KNbNbUOx" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();

          // update profile
          profileImage.src = profile.pictureUrl;
          profileName.innerText = profile.displayName;
          profileUID.innerText = profile.userId;

          // collect userId
          document.getElementById("lineUserIdtext").value = profile.userId;

          // show profile
          lineprofile.style.display = "block";
        } else {
          liff.login();
        }
      };
      main();


      
</script>
