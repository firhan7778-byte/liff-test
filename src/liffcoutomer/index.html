:root{
    --primary:#ff5f9e;
    --secondary:#ffc7dc;
    --light:#fff8fb;
    --glass:rgba(255,255,255,.30);
    --border:rgba(255,255,255,.55);
    --text:#4b3042;
    --shadow:0 20px 45px rgba(255,105,180,.18);
}

body{
    background:
        radial-gradient(circle at top left,#ffd9eb 0%,transparent 35%),
        radial-gradient(circle at bottom right,#ffeaf3 0%,transparent 35%),
        linear-gradient(135deg,#fff8fb,#ffe8f1,#fff5fa);
    background-attachment:fixed;
    font-family:'Prompt',sans-serif;
    color:var(--text);
}


/* กล่องหลัก */
.liff-content{
    max-width:750px;
    margin:40px auto;
    padding:35px;

    background:var(--glass);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border:1px solid rgba(255,255,255,.6);
    border-radius:30px;

    box-shadow:
        0 15px 45px rgba(255,182,193,.30),
        inset 0 1px 1px rgba(255,255,255,.8);

    position:relative;
    overflow:hidden;
}

.liff-content::before{
    content:"";
    position:absolute;
    inset:-120px;
    background:
        linear-gradient(45deg,
        transparent 45%,
        rgba(255,255,255,.55) 50%,
        transparent 55%);
    animation:shine 8s linear infinite;
}

@keyframes shine{
    from{
        transform:translateX(-120%) rotate(20deg);
    }
    to{
        transform:translateX(120%) rotate(20deg);
    }
}


/* หัวข้อ */
h3,h4{
    text-align:center;
    color:#d84b86;
    font-weight:700;
    letter-spacing:.5px;
}

h3{
    font-size:28px;
    margin-bottom:5px;
}

h4{
    font-size:22px;
}


/* Label */
.form-group label{
    display:block;
    margin-bottom:8px;
    color:#d14f84;
    font-weight:600;
}


/* INPUT */
.form-control,
.form-control-sm,
.form-control-date,
select,
textarea{

    width:100%;
    padding:13px 18px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,.8);

    background:rgba(255,255,255,.45);

    backdrop-filter:blur(10px);

    color:#5c4152;

    transition:.35s;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.7),
        0 5px 15px rgba(255,182,193,.12);
}

.form-control:focus,
.form-control-sm:focus,
.form-control-date:focus,
textarea:focus,
select:focus{

    outline:none;

    background:white;

    border-color:#ff6da7;

    box-shadow:
        0 0 0 4px rgba(255,105,180,.18),
        0 15px 30px rgba(255,105,180,.15);

    transform:translateY(-2px);
}


/* placeholder */

::placeholder{
    color:#b998a9;
}


/* row */

.form-row{
    display:flex;
    gap:20px;
}

.form-row .form-group{
    flex:1;
}


/* textarea */

textarea{
    resize:none;
}


/* RADIO */

input[type=radio]{
    accent-color:#ff5f9e;
}


/* BUTTON */

.btn-secondary{

    width:100%;
    margin-top:25px;

    padding:15px;

    border:none;

    border-radius:50px;

    font-size:17px;
    font-weight:700;

    color:white;

    cursor:pointer;

    background:
    linear-gradient(135deg,
    #ff8db8,
    #ff5f9e,
    #ff7eb5);

    background-size:300% 300%;

    animation:gradientMove 5s infinite;

    box-shadow:
        0 12px 30px rgba(255,105,180,.35);

    transition:.35s;
}

@keyframes gradientMove{
    0%{background-position:0%;}
    50%{background-position:100%;}
    100%{background-position:0%;}
}

.btn-secondary:hover{

    transform:translateY(-4px) scale(1.02);

    box-shadow:
        0 18px 40px rgba(255,105,180,.45);
}


/* profile */

#lineprofile img{

    width:110px;

    height:110px;

    border-radius:50%;

    border:4px solid rgba(255,255,255,.8);

    box-shadow:0 10px 25px rgba(255,182,193,.4);
}


/* Scroll */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-thumb{
    background:#ff9ec3;
    border-radius:20px;
}


/* Diamond Sparkle */

.liff-content::after{

    content:"✦";

    position:absolute;

    right:25px;
    top:25px;

    font-size:28px;

    color:rgba(255,255,255,.95);

    animation:sparkle 2s infinite ease-in-out;
}

@keyframes sparkle{

    0%{
        opacity:.2;
        transform:scale(.7) rotate(0deg);
    }

    50%{
        opacity:1;
        transform:scale(1.3) rotate(20deg);
    }

    100%{
        opacity:.2;
        transform:scale(.7) rotate(0deg);
    }

}

            const clientId = "CL" + Math.floor(Math.random()*900000);
            const massagerValue =
                document.getElementById("liff-booking-request-massager")
                .value.trim();
            const bookingData = {

                // ===== clients =====
                client_line_id:
                document.getElementById("lineUserIdtext").value.trim(),

                client_id: clientId,

                name:
                document.getElementById("liff-client-name").value.trim(),

                phone:
                document.getElementById("liff-client-phone").value.trim(),


                // ===== bookings =====
                booking_id: bookingId,

               massager_line_id:
                (massagerValue === "" || massagerValue === "none")
                ? null
                : massagerValue,

                appointment_date:
                document.getElementById("liff-booking-date").value.trim(),

                appointment_time:
                document.getElementById("liff-booking-time").value.trim(),

                service_type:
                document.getElementById("liff-booking-service").value.trim(),

                course_duration:
                document.getElementById("liff-booking-duration").value.trim(),

                package_name:
                document.getElementById("liff-booking-package").value.trim(),


                guests_count:
                Number(document.getElementById("liff-booking-guests").value),

                pregnancy_weeks:
                Number(document.getElementById("liff-pregnancy-weeks").value),


                address:
                document.getElementById("liff-client-address").value.trim(),

                google_map_link:
                document.getElementById("liff-client-map").value.trim(),

                massage_level:
                document.getElementById("liff-booking-level").value.trim(),

                pets:
                document.getElementById("liff-client-pets").value.trim(),

                client_note:
                document.getElementById("liff-client-note").value.trim(),


                is_repeated_request:false,

                booking_status:"pending_details"

            };


            const res = await fetch(
                "https://extruding-flashback-unblended.ngrok-free.dev/booking",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify(bookingData)
                }
            );


            const data = await res.json();

            console.log("Booking API Response:", data);

            return data;

        }




    </script>
  </body>
</html>
