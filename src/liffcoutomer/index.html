                                <div class="liff-content" id="client-liff-container">
                                     
                                    <div id="client-booking-form-panel">

                                    <div id="lineprofile" style="display: none;">
                                    <img width="100px" id="profileImage" src="" />
                                    <div>
                                        สวัสดี คุณ <b><span id="profileName"></span></b>
                                    </div>
                                    <div type="hidden" >UID <span id="profileUID">UID : </span></div>
                                    </div>
                                     <h4 style="color: var(--primary); font-size: 1.25rem;">แบบฟอร์มกรอกประวัติใช้บริการ </h4>
                                     <h3 style="color: var(--primary); font-size: 1.25rem;"> MOMOMOM WELLNESS</h3>
                                    <p style="font-size: 0.75rem; color: var(--text-muted);">กรุณากรอกข้อมูลนัดหมายบริการ </p>

                                         <input type="hidden" id="lineUserIdtext">  



                                        </div>

                                        <!-- <form id="liff-booking-form" onsubmit="handleClientBookingSubmit(event)">-->
                                            <form>
                                            
                                            <input type="hidden" id="liff-client-line-id" value="line_client_001">
                                            
                                            <div class="form-group">
                                                <label>ชื่อ-นามสกุล *</label>
                                                <input type="text" id="liff-client-name" class="form-control form-control-sm" required placeholder="ชื่อ-สกุล">
                                            </div>

                                            <div class="form-group">
                                                <label>เบอร์โทรศัพท์ *</label>
                                                <input type="tel" id="liff-client-phone" class="form-control form-control-sm" required placeholder="เช่น 0891234567">
                                            </div>

                                            <div class="form-row">
                                                <div class="form-group">
                                                    <label>วันที่นัดหมาย *</label>
                                                    <input type="date" id="liff-booking-date" class="form-control-date form-control-sm" required>
                                                </div>
                                                <div class="form-group">
                                                    <label>เวลาที่ต้องการ *</label>
                                                    <input type="time" id="liff-booking-time" class="form-control-date form-control-sm" required>
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label>บริการนวด *</label>
                                                <select id="liff-booking-service" class="form-control form-control-sm" onchange="updateLiffPackages()">
                                                    <option value="นวดอโรมา">นวดน้ำมันอโรมา (Aroma Massage)</option>
                                                    <option value="นวดไทยโบราณ">นวดไทยโบราณ (Thai Traditional)</option>
                                                    <option value="นวดสปาครรภ์">นวดคุณแม่ตั้งครรภ์ (Pregnancy Spa)</option>
                                                </select>
                                            </div>

                                            <div class="form-row">
                                                <div class="form-group">
                                                    <label>เวลาคอร์ส *</label>
                                                    <select id="liff-booking-duration" class="form-control form-control-sm">
                                                        <option value="60 นาที">60 นาที (1 ชม.)</option>
                                                        <option value="90 นาที">90 นาที (1.5 ชม.)</option>
                                                        <option value="120 นาที">120 นาที (2 ชม.)</option>
                                                    </select>
                                                </div>
                                                <div class="form-group">
                                                    <label>จำนวนลูกค้า *</label>
                                                    <select id="liff-booking-guests" class="form-control form-control-sm">
                                                        <option value="1">1 ท่าน</option>
                                                        <option value="2">2 ท่าน</option>
                                                        <option value="3">3 ท่าน</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label>แพ็คเกจ/คอร์ส *</label>
                                                <select id="liff-booking-package" class="form-control form-control-sm">
                                                    <option value="1">1 ท่าน</option>
                                                </select>
                                            </div>

                                            <!-- Pregnancy Check -->
                                            <div class="form-group">
                                                <label>กำลังตั้งครรภ์อยู่หรือไม่?</label>
                                                <div style="display: flex; gap: 1rem; align-items: center; font-size: 0.85rem;">
                                                    <label><input type="radio" name="pregnancy-check" value="no" checked onchange="togglePregnancyInput(false)"> ไม่ได้ตั้งครรภ์</label>
                                                    <label><input type="radio" name="pregnancy-check" value="yes" onchange="togglePregnancyInput(true)"> ตั้งครรภ์</label>
                                                </div>
                                            </div>

                                            <div class="form-group d-none" id="pregnancy-weeks-group">
                                                <label>อายุครรภ์ (กี่สัปดาห์) *</label>
                                                <input type="number" id="liff-pregnancy-weeks" class="form-control form-control-sm" placeholder="เช่น 24 สัปดาห์" min="1" max="40">
                                            </div>

                                            <div class="form-group">
                                                <label>ที่อยู่ในการให้บริการ *</label>
                                                <textarea id="liff-client-address" class="form-control form-control-sm" rows="2" placeholder="บ้านเลขที่, ชื่อคอนโด/หมู่บ้าน, ซอย, ถนน..." ></textarea>
                                            </div>

                                            <div class="form-group">
                                                <label>แผนที่ Google Map Link *</label>
                                                <input type="url" id="liff-client-map" class="form-control form-control-sm" placeholder="เช่น https://maps.app.goo.gl/..." >
                                            </div>

                                            <div class="form-row">
                                                <div class="form-group">
                                                    <label>ระดับน้ำหนักแรงนวด</label>
                                                    <select id="liff-booking-level" class="form-control form-control-sm">
                                                        <option value="เบา (Light)">เบา (Light)</option>
                                                        <option value="ปานกลาง (Medium)" selected>ปานกลาง (Medium)</option>
                                                        <option value="หนัก (Firm)">หนัก (Firm)</option>
                                                    </select>
                                                </div>
                                                <div class="form-group">
                                                    <label>สัตว์เลี้ยงที่บ้าน</label>
                                                    <input type="text" id="liff-client-pets" class="form-control form-control-sm" placeholder="เช่น มีแมว 2 ตัว, ไม่มี">
                                                </div>
                                            </div>

                                            <!-- Repeated Request -->
                                            <div class="form-group">
                                                <label style="color: var(--accent-gold);"><i class="fa-solid fa-star"></i> ระบุเจาะจงหมอนวดคนเดิม</label>
                                                <select id="liff-booking-request-massager" class="form-control form-control-sm" style="border-color: var(--accent-gold);">
                                                    <option value="none">-- ไม่ระบุเจาะจง (จองทั่วไป) --</option>
                                                    <!-- Filled dynamically -->
                                                </select>
                                                <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.2rem;">
                                                    หากเลือกหมอคนเดิม ระบบจะจ่ายงานให้ท่านนั้นพิจารณาก่อน และแสดงกรอบสีทองพิเศษในระบบแอดมิน
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label>หมายเหตุ / อาการที่ต้องการเน้น</label>
                                                <textarea id="liff-client-note" class="form-control form-control-sm" rows="2" placeholder="เช่น เน้นบ่าไหล่, ไม่นวดหลัง..."></textarea>
                                            </div>
                                                 
                                                    <button class="btn btn-secondary"  type="button" onclick="send()">
                                                        ส่งแบบฟอร์มการนัดหมาย
                                                    </button>   
                                                                                            
                                        </form>
                                    </div>
                                    
                                    <!-- Booking Success Info
                                     Booking Success Info

                                        <div class="logo-icon" style="background: var(--success); color: white; width: 60px; height: 60px; font-size: 2rem; margin: 0 auto 1.5rem;"><i class="fa-solid fa-check"></i></div>
                                        <h4 style="color: var(--success); font-size: 1.4rem; margin-bottom: 1rem;">ส่งข้อมูลการจองสำเร็จ!</h4>

                                            และรหัสลูกค้าของท่านคือ <strong id="client-mom-code" style="color: var(--accent-gold);">MOM-0001</strong>
                                        </p>
                                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2rem;">แอดมินจะดำเนินการค้นหาหมอนวดและยืนยันข้อความแจ้งเตือนกลับหาท่านทาง LINE OA ค่ะ</p>
                                        <button onclick="resetClientBookingForm()" class="btn btn-secondary" style="width: 100%;">ทำการนัดหมายเพิ่ม</button>
                                    </div> -->

                                    </div>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
    <script src="app.js"></script>
    <script>
      let userId = "";

      const logOut = () => {
        liff.logout();
        window.location.reload();
      };
      const main = async () => {
        await liff.init({ liffId: "2010645154-hZoEdqGC" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();

          // update profile
          profileImage.src = profile.pictureUrl;
          profileName.innerText = profile.displayName;
          profileUID.innerText = profile.userId;

          // collect userId
          document.getElementById("lineUserIdtext").value = profile.userId;

          // show profile
          lineprofile.style.display = "block";
        } else {
          liff.login();
        }
      };
      main();

      async function send() {
            const to = document.getElementById("lineUserIdtext").value.trim();



            
            const name = document.getElementById("liff-client-name").value.trim();
            const phone = document.getElementById("liff-client-phone").value.trim();
            const date = document.getElementById("liff-booking-date").value.trim();
            const time = document.getElementById("liff-booking-time").value.trim();
            const service = document.getElementById("liff-booking-service").value.trim();
            const duration = document.getElementById("liff-booking-duration").value.trim();
            const guests = document.getElementById("liff-booking-guests").value.trim();
            const packageName = document.getElementById("liff-booking-package").value.trim();
            const weeks = document.getElementById("liff-pregnancy-weeks").value.trim();
            const address = document.getElementById("liff-client-address").value.trim();
            const map = document.getElementById("liff-client-map").value.trim();
            const level = document.getElementById("liff-booking-level").value.trim();
            const pets = document.getElementById("liff-client-pets").value.trim();
            const massager = document.getElementById("liff-booking-request-massager").value.trim();
            const note = document.getElementById("liff-client-note").value.trim();
           





            const message = 

            "รายละเอียดการจอง"+"\n\n"+
            
             "รหัสบริการ"+"\n"+ "รหัสป้าหมอ"+"\n"+ 
             "นัดหมาย วันที่ " + date +" เวลา: " + time + "\n" +
            "บริการนวด: " + service + "\n" +
            "เวลาคอร์ส : " + duration + "\n" +
            "แพ็คเกจ/คอร์ส : " + packageName + "\n" +
            "ลูกค้ากี่ท่าน : " + guests + "\n" +
            "อายุครรภ์ (กี่สัปดาห์) : " + weeks + "\n" +
            "รหัสลูกค้า"+"\n"+ "ชื่อลูกค้า: " + name + "\n" +
            "เบอร์โทรลูกค้า: " + phone + "\n\n" +
            "ที่อยู่: " + address + "\n" +
            "แผนที่ Google Map: " + map + "\n" +
            "ระดับนวด: " + level + "\n" +
            "สัตว์เลี้ยง: " + pets + "\n" +
            "ระบุเจาะจงหมอ: " + massager + "\n" +
           "หมายเหตุลูกค้า: " + note;







            if (!to || !message) {
                alert("กรุณากรอก User ID และข้อความ");
                return;
            }

            try {
                const res = await fetch("https://extruding-flashback-unblended.ngrok-free.dev/send", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        to,
                        message
                    })
                });

                const data = await res.json();

                console.log(data);

                if (data.success) {
                    alert("ส่งข้อความสำเร็จ");
                } else {
                    alert(JSON.stringify(data));
                }

            } catch (err) {
                console.error(err);
                alert("ไม่สามารถเชื่อมต่อ Server ได้");
            }
        }





    </script>
  </body>
</html>
